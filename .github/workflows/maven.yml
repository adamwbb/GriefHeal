# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download & Install Paper Jar
      run: |
        curl -o paper.jar "https://fill-data.papermc.io/v1/objects/bd3a58cf96874e5ea6643f5f6fe9b4f5bf9e34b795fa078c2f0ee8b98b2f907e/paper-26.2-112.jar"
        mvn install:install-file -Dfile=paper.jar -DgroupId=io.papermc.paper -DartifactId=paper-api -Dversion=26.2-build112 -Dpackaging=jar

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Upload Built JAR
      uses: actions/upload-artifact@v4
      with:
        name: GriefHeal-jar
        path: target/GriefHeal-*.jar
        
