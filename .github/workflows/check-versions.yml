name: Check Paper Versions

on:
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest

    steps:
    - name: Query Exact Paper API Versions
      run: |
        echo "=== LAST 25 PUBLISHED PAPER-API VERSIONS ==="
        curl -sL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -n 25
        echo "==========================================="
