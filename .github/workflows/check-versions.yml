name: Check Paper Versions

on:
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest

    steps:
    - name: List Files in 26.2.build.112-stable
      run: |
        echo "=== FILES IN 26.2.build.112-stable DIRECTORY ==="
        curl -sL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/26.2.build.112-stable/maven-metadata.xml || true
        echo "--- Directory HTML / File listing ---"
        curl -sL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/26.2.build.112-stable/ | grep -iE '\.jar|\.pom' || true
        echo "==============================================="
        
